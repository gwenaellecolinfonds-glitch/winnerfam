<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WINNER FAMILY - CASINO HUB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: rgba(17, 24, 39, 0.85);
            --border-glow: rgba(0, 255, 255, 0.25);
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, rgba(0, 255, 255, 0.08) 0%, transparent 50%);
            font-family: 'Fira Code', monospace;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 0;
        }

        .hub-container {
            background: var(--card-bg);
            border: 1px solid var(--border-glow);
            backdrop-filter: blur(16px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }

        .btn-register {
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid #00ffff;
            color: #00ffff;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.05em;
            transition: all 0.3s;
            display: block;
            text-decoration: none;
        }
        .btn-register:hover {
            background: #00ffff;
            color: #000;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
        }

        .game-card {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 14px;
            text-decoration: none;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 10px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }

        .game-card:hover {
            transform: translateY(-4px);
            border-color: #00ffff;
            box-shadow: 0 12px 30px -5px rgba(0, 255, 255, 0.25);
            background: rgba(20, 30, 50, 0.95);
        }

        .img-container {
            width: 100%; height: 110px; background: rgba(0, 0, 0, 0.4);
            border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 4px;
        }

        .game-img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; }
    </style>
</head>
<body>

    <div class="w-full max-w-lg hub-container p-6 sm:p-8 rounded-3xl space-y-6">
        <div class="text-center space-y-3">
            <h1 class="text-2xl sm:text-3xl font-black tracking-wider uppercase">
                WINNER FAMILY <span class="text-cyan-400">CASINO</span>
            </h1>
            <!-- Bouton d'inscription ajouté -->
            <a href="https://one-vv0011.com/?open=register&p=9v9g" target="_blank" class="btn-register">
                <i class="fa-solid fa-user-plus mr-2"></i> CLIQUEZ ICI POUR VOUS INSCRIRE
            </a>
            <p class="text-[10px] text-zinc-400">Sélectionnez votre jeu pour lancer le prédicteur</p>
        </div>
        
        <div class="grid grid-cols-2 gap-3.5">
            <!-- Crash -->
            <div class="game-card" onclick="goToGateway('crash')">
                <div class="img-container"><img src="{{ url_for('static', filename='crash.png') }}" alt="Crash" class="game-img"></div>
                <div><h2 class="font-bold text-xs">Crash</h2><p class="text-[9px] text-zinc-400">1win Games</p></div>
            </div>

            <!-- Lucky Jet -->
            <div class="game-card" onclick="goToGateway('lucky')">
                <div class="img-container"><img src="{{ url_for('static', filename='lucky.png') }}" alt="Lucky Jet" class="game-img"></div>
                <div><h2 class="font-bold text-xs">Lucky Jet</h2><p class="text-[9px] text-zinc-400">1win Games</p></div>
            </div>

            <!-- Mines Classic -->
            <div class="game-card" onclick="goToGateway('mines')">
                <div class="img-container"><img src="{{ url_for('static', filename='mines.png') }}" alt="Mines Classic" class="game-img"></div>
                <div><h2 class="font-bold text-xs">Mines Classic</h2><p class="text-[9px] text-zinc-400">1win Games</p></div>
            </div>

            <!-- Aviator -->
            <div class="game-card" onclick="goToGateway('aviator')">
                <div class="img-container"><img src="{{ url_for('static', filename='aviator.png') }}" alt="Aviator" class="game-img"></div>
                <div><h2 class="font-bold text-xs">Aviator</h2><p class="text-[9px] text-zinc-400">Spribe</p></div>
            </div>
        </div>

        <div class="text-center border-t border-zinc-800 pt-3">
            <span class="text-[9px] text-zinc-500 tracking-widest uppercase">© 2026 WINNER FAMILY • CASINO VIP</span>
        </div>
    </div>

    <script>
        function goToGateway(gameKey) {
            window.location.href = `/game/${gameKey}`;
        }
    </script>
</body>
</html>
